<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="dashboard-body">
    <div class="dashboard-layout">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">S</div>
          <div>
            <strong>Sistema</strong>
            <span>Acadêmico</span>
          </div>
        </div>

        <nav class="sidebar-nav" aria-label="Menu principal">
          <button class="nav-item active" type="button" data-section="home" onclick="renderSection('home')">
            <span class="icon">🏠</span>
            <span>Home</span>
          </button>

          <button class="nav-item" type="button" data-section="curso" onclick="renderSection('curso')">
            <span class="icon">📚</span>
            <span>Curso</span>
          </button>

          <button class="nav-item" type="button" data-section="usuario" onclick="renderSection('usuario')">
            <span class="icon">👤</span>
            <span>Usuário</span>
          </button>

          <button class="nav-item" type="button" data-section="empresa" onclick="renderSection('empresa')">
            <span class="icon">🏢</span>
            <span>Empresa</span>
          </button>
        </nav>

        <button id="logoutBtn" class="logout-btn" type="button" onclick="logoutUsuario()">Sair</button>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Painel</p>
            <h1 id="pageTitle">Home</h1>
          </div>
          <div class="user-pill">Administrador</div>
        </header>

        <section id="pageContent" class="page-content" aria-live="polite"></section>
      </main>
    </div>

    <script src="./js/api.js"></script>
    <script src="./js/dashboard.js"></script>
    <script src="./js/usuarios.js"></script>
  </body>
</html>
